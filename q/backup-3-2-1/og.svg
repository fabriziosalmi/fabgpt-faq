<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='630' viewBox='0 0 1200 630'><rect width='1200' height='630' fill='#0f1117'/><rect width='1200' height='10' fill='#10a37f'/><circle cx='108' cy='72' r='30' fill='#10a37f'/><text x='108' y='86' font-size='34' font-weight='700' text-anchor='middle' fill='#fff' font-family='-apple-system,Segoe UI,Roboto,Arial,sans-serif'>F</text><text x='150' y='84' font-size='30' font-weight='700' fill='#ececec' font-family='-apple-system,Segoe UI,Roboto,Arial,sans-serif'>FabGPT-FAQ</text><text x='80' y='150' font-size='52' font-weight='700' fill='#ececec' font-family='-apple-system,Segoe UI,Roboto,Arial,sans-serif'>Come si fa un backup con la regola 3-2-1?</text><g transform='translate(600 350)'><svg class='diagram-svg' viewBox='0 0 640 190' width='560' role='img' xmlns='http://www.w3.org/2000/svg' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif'><defs><marker id='ah' markerWidth='9' markerHeight='9' refX='7' refY='3' orient='auto'><path d='M0,0 L7,3 L0,6 Z' fill='#8b8f9a'/></marker></defs><text x='320' y='30' text-anchor='middle' font-size='14' fill='#10a37f' font-weight='600'>Regola 3-2-1</text><rect x='30' y='60' width='170' height='90' rx='10' fill='#1a1d24' stroke='#10a37f' stroke-width='2'/><text x='115.0' y='101.0' text-anchor='middle' font-size='15' font-weight='600' fill='#d7d9de'>3 copie</text><text x='115.0' y='119.0' text-anchor='middle' font-size='15' font-weight='500' fill='#d7d9de'>dei dati</text><rect x='235' y='60' width='170' height='90' rx='10' fill='#1a1d24' stroke='#3a3d46' stroke-width='1.4'/><text x='320.0' y='101.0' text-anchor='middle' font-size='15' font-weight='500' fill='#d7d9de'>2 supporti</text><text x='320.0' y='119.0' text-anchor='middle' font-size='15' font-weight='500' fill='#d7d9de'>diversi</text><rect x='440' y='60' width='170' height='90' rx='10' fill='#1a1d24' stroke='#3a3d46' stroke-width='1.4'/><text x='525.0' y='101.0' text-anchor='middle' font