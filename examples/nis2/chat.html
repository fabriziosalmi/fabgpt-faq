<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIS2 Assistant | Assistente Deterministico Direttiva NIS2</title>
  <meta name="description" content="Assistente normativo per la Direttiva NIS2 e D.Lgs. 138/2024. 100% risposte verificate, zero allucinazioni.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="../../engine/style.css">
  <style>
    :root {
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --accent: #0284c7;
    }
  </style>
</head>
<body>

  <div id="app-layout">
    <!-- Topbar -->
    <header class="app-header">
      <div class="brand-box">
        <div class="brand-dot"></div>
        <span class="brand-title" id="header-title">NIS2 Assistant</span>
        <span class="brand-tag">Zero Allucinazioni · D.Lgs. 138/2024</span>
      </div>
      <div class="header-links">
        <a href="index.html">← Dashboard Widget Demo</a>
        <a href="q/">Indice Domande AEO ↗</a>
      </div>
    </header>

    <!-- Chat Stream Container -->
    <main id="chat"></main>

    <!-- Input Composer -->
    <div class="composer-box">
      <form id="composer-form">
        <input type="text" id="input" placeholder="Fai una domanda sulla NIS2..." autocomplete="off" />
        <button type="submit" id="send" aria-label="Invia domanda">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
      <div id="composer-note">
        Assistente normativo deterministico · Nessun LLM generativo · Risposte 100% conformi
      </div>
    </div>
  </div>

  <!-- Core Decoupled Engine Scripts -->
  <script src="../../engine/matcher.js"></script>
  <script src="../../engine/tools.js"></script>
  <script src="nis2_tools.js"></script>
  <script src="../../engine/app.js"></script>
</body>
</html>
