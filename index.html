<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="FabGPT — chiedimi qualsiasi cosa sulle repo di Fabrizio Salmi">
  <title>FabGPT</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%2310a37f'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'>F</text></svg>">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot">F</span>
      <span class="brand-name">FabGPT</span>
      <span class="brand-tag">faq</span>
    </div>
    <nav class="topnav"><a href="q/">Tutte le domande</a></nav>
  </header>

  <main id="chat" class="chat" aria-live="polite"></main>

  <footer class="composer">
    <form id="composer-form" class="composer-inner" autocomplete="off">
      <textarea id="input" rows="1" placeholder="" aria-label="Scrivi un messaggio" spellcheck="false"></textarea>
      <button id="send" type="submit" aria-label="Invia" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
      </button>
    </form>
    <p class="composer-note" id="composer-note"></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
